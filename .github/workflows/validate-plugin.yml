name: Validate Hospitality OS Plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Run Hospitality OS structural checks
        run: |
          python plugins/hospitality-os-plugin/scripts/validate_hospitality_plugin.py
          python plugins/hospitality-os-plugin/scripts/validate_video_fixtures.py
      - name: Run package validation regression tests
        run: python -m unittest discover -s plugins/hospitality-os-plugin/tests -p 'test_*.py' -v
      - name: Validate video fixtures
        run: python plugins/hospitality-os-plugin/scripts/validate_video_schema.py
